<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ============ Quiz Room — "game show" design system ============
   Bold outlines + hard offset shadows, bright accent blocks, big type, playful motion. */
:root{
  color-scheme:light dark;
  --bg:#FFF7EA; --dot:#E8D9BF; --surface:#FFFFFF; --surface-2:#FFF1DA; --ink:#17142A; --muted:#5E5874;
  --edge:#17142A; --shadow:#17142A; --line:#EADFCB;
  --primary:#5B3DF5; --primary-hover:#4B2EE6; --on-primary:#FFFFFF; --primary-soft:#ECE7FF; --link:#4B2EE6;
  --lime:#6EE7C5; --pink:#FF8CC6; --yellow:#FFD84D; --sky:#7FD6F7; --orange:#FFA463; --on-accent:#17142A;
  --green:#0F7A43; --green-soft:#DDF7E6; --red:#C42B2B; --red-soft:#FFE3E0;
  --code:#1C1930; --glow-a:#FFB3DA; --glow-b:#B9A8FF; --glow-c:#9CF0DA;
  --head:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
  --r:18px; --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#110F1A; --dot:#24203A; --surface:#1C1929; --surface-2:#252136; --ink:#F4F1FF; --muted:#ADA7C6;
  --edge:#7A72A6; --shadow:#4C4474; --line:#2E2945;
  --primary:#6246FF; --primary-hover:#7259FF; --primary-soft:#2A2352; --link:#A996FF;
  --green:#5BD08F; --green-soft:#12301F; --red:#FF8A80; --red-soft:#3A1A1F;
  --code:#0D0B15; --glow-a:#6B2F63; --glow-b:#3B2C8F; --glow-c:#14453C;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;overflow-x:clip;color:var(--ink);font:16px/1.6 var(--body);
  background:var(--bg) radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/22px 22px}
a{color:var(--link);text-underline-offset:3px}
::selection{background:var(--lime);color:var(--on-accent)}
/* scrollbar in the same style: violet thumb with an outline, lime while dragging */
html{scrollbar-color:var(--primary) var(--bg)}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--bg);border-left:2px solid var(--line)}
::-webkit-scrollbar-thumb{background:var(--primary);border:3px solid var(--bg);border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--edge)}
::-webkit-scrollbar-thumb:hover{background:var(--primary-hover)}
::-webkit-scrollbar-thumb:active{background:var(--lime)}
::-webkit-scrollbar-corner{background:var(--bg)}

/* drifting color glows behind everything */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--glow-a);top:-18vmax;left:-12vmax}
.bg i:nth-child(2){background:var(--glow-b);top:20vh;right:-20vmax;animation-duration:30s;animation-delay:-8s}
.bg i:nth-child(3){background:var(--glow-c);bottom:-24vmax;left:20vw;animation-duration:36s;animation-delay:-14s;opacity:.35}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;row-gap:10px;justify-content:space-between;align-items:center;
  padding:14px max(24px,calc((100% - 1192px) / 2))}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  mask-image:linear-gradient(#000 85%,transparent)}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 22px/1 var(--head);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--primary);color:#fff;font:800 20px/1 var(--head);
  border:2px solid var(--edge);box-shadow:3px 3px 0 var(--shadow);transform:rotate(-6deg);transition:transform .3s var(--spring)}
.brand:hover .logo{transform:rotate(6deg) scale(1.08)}
.top nav{display:flex;gap:4px;padding:4px;background:var(--surface);border:2px solid var(--edge);border-radius:16px;box-shadow:3px 3px 0 var(--shadow)}
.top nav a{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:11px;font-weight:600;font-size:15px;
  color:var(--muted);text-decoration:none;transition:background-color .2s var(--out),color .2s var(--out)}
.top nav a:hover{color:var(--ink);background:var(--surface-2)}
.top nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.top nav svg{width:18px;height:18px;flex:none}
@media (max-width:520px){.top nav{width:100%}.top nav a{flex:1;justify-content:center;padding:0 8px}}

/* ---------- layout + type ---------- */
main{max-width:1240px;margin:0 auto;padding:8px 24px 140px}
h1{font:800 clamp(34px,6.5vw,58px)/1.02 var(--head);letter-spacing:-.04em;margin:10px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
h2{font:700 21px/1.3 var(--head);letter-spacing:-.015em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 26px;font-size:17px;max-width:62ch}
.muted{color:var(--muted)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.hl{position:relative;white-space:nowrap;z-index:0;color:#fff}
.hl::after{content:"";position:absolute;z-index:-1;left:-.08em;right:-.08em;top:.12em;bottom:-.1em;background:var(--primary);border-radius:8px;transform:skew(-8deg) scaleX(0);transform-origin:left;
  animation:mark .7s .35s var(--out) forwards}
@keyframes mark{to{transform:skew(-8deg) scaleX(1)}}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:5px 5px 0 var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600;text-decoration:none}
.back::before{content:"←";transition:transform .2s var(--out)}
.back:hover::before{transform:translateX(-4px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
main>.spread{margin-bottom:22px}
.meta{color:var(--muted);font-size:14px;margin:0 0 14px}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}

/* ---------- buttons: they press down into their shadow ---------- */
button,.btn{font:700 15px/1.2 var(--body);border:2px solid var(--edge);background:var(--surface);color:var(--ink);min-height:44px;
  padding:10px 18px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:3px 3px 0 var(--shadow);touch-action:manipulation;
  transition:transform .15s var(--out),box-shadow .15s var(--out),background-color .2s var(--out)}
button:hover:not(:disabled),.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shadow)}
button:active:not(:disabled),.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow);transition-duration:.05s}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-wa{background:#117A42;color:#fff}
.btn-light{background:var(--lime);color:var(--on-accent)}
.btn-danger{color:var(--red)}
.btn-sm{padding:8px 13px;font-size:14px}
.linkbtn{border:0;background:none;box-shadow:none;color:var(--link);padding:10px 0;font-weight:600}
.linkbtn:hover:not(:disabled),.linkbtn:active:not(:disabled){transform:none;box-shadow:none;text-decoration:underline}
.icon{padding:6px 10px;font-size:14px;min-width:44px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
h1[tabindex="-1"]:focus,main:focus{outline:none}
.skip{position:absolute;left:12px;top:-80px;z-index:40;background:var(--yellow);color:var(--on-accent);padding:10px 14px;border:2px solid var(--edge);border-radius:12px;font-weight:700}
.skip:focus{top:12px}

/* ---------- forms ---------- */
input,textarea,select{font:inherit;width:100%;min-height:46px;padding:10px 14px;border:2px solid var(--edge);border-radius:12px;background:var(--surface);color:var(--ink);
  transition:box-shadow .2s var(--out),border-color .2s var(--out)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
textarea{resize:vertical}
select{width:auto}
.code-in{font:14px/1.6 var(--mono);background:var(--code);color:#E8E5F7;border-color:var(--edge);min-height:110px;tab-size:2}
.code-in.small{min-height:76px}
label.f{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:15px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--primary)}
.err{color:var(--red);font-weight:600;min-height:1.2em;margin:8px 0}

/* ---------- home ---------- */
.hero{padding:10px 0 8px}
.hero h1{font-size:clamp(42px,9vw,84px);margin-bottom:26px}
.leaders{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 30px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border:2px solid var(--edge);border-radius:999px;background:var(--surface);
  font-weight:600;font-size:14px;box-shadow:2px 2px 0 var(--shadow);text-decoration:none;color:var(--ink)}
.chip b{display:grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--yellow);color:var(--on-accent);font:800 13px/1 var(--head)}
.chip:nth-child(2) b{background:var(--sky)}.chip:nth-child(3) b{background:var(--orange)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.qcard{--accent:var(--lime);position:relative;display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden;margin:0;
  transition:transform .25s var(--spring),box-shadow .25s var(--out)}
.qgrid .qcard:nth-child(5n+2){--accent:var(--pink)}.qgrid .qcard:nth-child(5n+3){--accent:var(--sky)}
.qgrid .qcard:nth-child(5n+4){--accent:var(--yellow)}.qgrid .qcard:nth-child(5n+5){--accent:var(--orange)}
.qcard:hover{transform:translate(-3px,-4px) rotate(-.4deg);box-shadow:9px 9px 0 var(--shadow)}
.qcard .band{display:flex;justify-content:space-between;align-items:flex-end;padding:16px 18px 14px;background:var(--accent);color:var(--on-accent);border-bottom:2px solid var(--edge)}
.qcard .num{font:800 46px/.9 var(--head);letter-spacing:-.04em}
.qcard .num small{display:block;font:600 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.qcard .tags{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qcard .tags span{font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.65);border:1.5px solid var(--on-accent)}
.qcard .body{padding:0 18px;flex:1}
.qcard h2{font-size:20px;margin:0 0 4px;overflow-wrap:anywhere}
.qcard .acts{display:flex;gap:10px;padding:0 18px 18px}
.qcard .acts .btn{flex:1}

/* ---------- questions ---------- */
.q-title{font:600 18px/1.45 var(--body);margin:0 0 14px;white-space:pre-wrap}
.qnum{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;margin-right:10px;border-radius:10px;background:var(--ink);color:var(--bg);font:800 16px/1 var(--head);vertical-align:middle}
.badge{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;border:2px solid currentColor}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.no{background:var(--red-soft);color:var(--red)}
.pill{font:600 12px/1 var(--body);padding:5px 10px;border-radius:999px;background:var(--primary-soft);color:var(--link);vertical-align:middle;border:1.5px solid currentColor}
.codebox{background:var(--code);border:2px solid var(--edge);border-radius:14px;overflow:hidden;margin:0 0 16px;max-width:100%}
.codebar{display:flex;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid #2E2A45;color:#8E89A8;font:13px var(--mono)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.codebody{display:flex;overflow-x:auto;font:14px/1.75 var(--mono)}
.gutter{padding:14px 10px 14px 16px;color:#5C5779;text-align:right;user-select:none;flex:none}
.codebody pre{margin:0;padding:14px 18px 14px 8px;flex:1}
.codebody pre,.codebody code{font:inherit}
.codebody code.hljs{background:none;padding:0;overflow:visible}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--edge);border-radius:14px;margin-bottom:12px;
  background:var(--surface);font-weight:500;color:var(--ink);box-shadow:3px 3px 0 var(--shadow);justify-content:flex-start}
.opt .k{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--edge);font:800 14px/1 var(--head);color:var(--ink);background:var(--surface-2);transition:all .2s var(--out)}
.opt .t{white-space:pre-wrap;word-break:break-word}
.opt .note{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;padding-left:10px}
.opt.pick{background:var(--primary-soft);border-color:var(--primary);box-shadow:3px 3px 0 var(--primary)}
.opt.pick .k{background:var(--primary);border-color:var(--primary);color:#fff;animation:pop .35s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.opt.right{background:var(--green-soft);border-color:var(--green);box-shadow:3px 3px 0 var(--green)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.right .note{color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
button.opt.wrong{animation:shake .4s ease-in-out}
div.opt{cursor:default}
.explain{background:var(--surface-2);border:2px dashed var(--edge);padding:12px 16px;border-radius:14px;margin-top:10px;white-space:pre-wrap}
.explain::before{content:"Why: ";font-weight:700}
.outcmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.outcmp .lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.outcmp pre{margin:0;padding:12px 14px;border-radius:12px;font:14px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.okp{background:var(--green-soft);border:2px solid var(--green)}
.nop{background:var(--red-soft);border:2px solid var(--red)}
@media (max-width:560px){.outcmp{grid-template-columns:1fr}}

/* sticky answer bar with a filling progress track */
.submitbar{position:sticky;bottom:14px;display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--ink);color:var(--bg);border:2px solid var(--edge);border-radius:20px;padding:12px 12px 12px 20px;margin-top:24px;box-shadow:5px 5px 0 var(--primary)}
.submitbar #prog{font-weight:600;font-size:14px}
.pbar{flex:1 1 140px;height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 22%,transparent);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--sky));transform-origin:left;transform:scaleX(0);transition:transform .5s var(--spring)}
.timer{font:600 15px var(--mono);padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.timer:empty{display:none}
.timer.low{background:var(--red);color:#fff}
.timer.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}

/* ---------- score + leaderboards ---------- */
.scoreline{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;margin:6px 0 22px}
.scoreline .big{font:800 clamp(56px,11vw,96px)/.9 var(--head);letter-spacing:-.05em;padding:10px 18px;background:var(--yellow);color:var(--on-accent);
  border:2px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);transform:rotate(-2deg)}
.title-won{display:inline-block;font:800 26px/1.2 var(--head);margin:0 0 16px;padding:6px 14px;background:var(--pink);color:var(--on-accent);border:2px solid var(--edge);border-radius:14px;
  box-shadow:3px 3px 0 var(--shadow);animation:wobble 1s .3s var(--spring) both}
@keyframes wobble{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.bdg{background:var(--surface);border:2px solid var(--edge);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
.lb{list-style:none;margin:0;padding:0}
.lb>li{display:grid;grid-template-columns:64px 1fr auto auto;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--edge);
  border-radius:16px;padding:12px 18px;margin-bottom:12px;box-shadow:4px 4px 0 var(--shadow);transition:transform .2s var(--out),box-shadow .2s var(--out)}
.lb>li:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.lb .rank{font:800 38px/1 var(--head);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px var(--muted)}
.lb>li:nth-child(-n+3) .rank{-webkit-text-stroke:0;color:var(--ink)}
.lb .who{font-weight:700;font-size:17px;word-break:break-word}
.lb .sc{font:800 24px/1 var(--head)}
.lb .tm{color:var(--muted);font-size:14px;min-width:64px;text-align:right;font-family:var(--mono)}
.lb>li.first{background:var(--yellow);color:var(--on-accent);box-shadow:5px 5px 0 var(--shadow)}
.lb>li.first .rank,.lb>li.first .tm,.lb>li.first .hint,.lb>li.first summary,.lb>li.first .hist a,.lb>li.first .muted{color:var(--on-accent)}
.lb>li.first .bdg{background:#fff;color:var(--on-accent);border-color:var(--on-accent)}
.lb>li.you{border-color:var(--primary);box-shadow:4px 4px 0 var(--primary)}
.lb details{font-size:14px;font-weight:400;margin-top:6px}
.lb summary{cursor:pointer;color:var(--link);width:max-content;font-weight:600}
.lb .hist{list-style:none;margin:6px 0 0;padding:0}
.lb .hist li{display:flex;justify-content:space-between;gap:10px;border-top:1.5px dashed var(--line);padding:6px 0}
@media (max-width:520px){.lb>li{grid-template-columns:44px 1fr auto;gap:10px;padding:12px 14px}.lb .rank{font-size:28px}.lb .tm{grid-column:2;text-align:left;margin-top:-8px}}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.react{min-height:36px;padding:3px 10px;font-size:14px;font-weight:600;border-radius:999px;box-shadow:2px 2px 0 var(--shadow)}
.react:hover:not(:disabled){box-shadow:3px 3px 0 var(--shadow)}
.react.me{background:var(--primary-soft);border-color:var(--primary);box-shadow:2px 2px 0 var(--primary)}
.react.me{animation:pop .35s var(--spring)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;margin:14px 0 26px;padding:0 4px}
.podium .p{text-align:center;min-width:0}
.podium .who{font-weight:700;word-break:break-word;margin-bottom:8px}
.podium .blk{border:2px solid var(--edge);border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 4px;
  font:800 30px/1 var(--head);color:var(--on-accent);box-shadow:4px 4px 0 var(--shadow);transform-origin:bottom}
.podium .blk small{font:600 13px var(--body);margin-top:8px}
.podium .p1 .blk{height:170px;background:var(--yellow)}
.podium .p2 .blk{height:128px;background:var(--sky)}
.podium .p3 .blk{height:98px;background:var(--orange)}
.podium .crown{font-size:32px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.podium .av{font-size:34px;line-height:1.2}
.avatars{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.avatars legend{padding:0}
.avatars label{cursor:pointer}
.avatars input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.avatars span{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--edge);border-radius:14px;background:var(--surface);
  box-shadow:2px 2px 0 var(--shadow);transition:transform .25s var(--spring),background-color .2s}
.avatars label:hover span{transform:translateY(-3px) rotate(-6deg)}
.avatars input:checked+span{background:var(--primary-soft);border-color:var(--primary);box-shadow:3px 3px 0 var(--primary);transform:scale(1.1) rotate(-4deg)}
.avatars input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}

/* ---------- admin ---------- */
.qrow h2{margin-bottom:4px}
.status-closed{color:var(--red);font-weight:700}
.optin{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.optin input[type=radio]{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--green)}
.optin .k{font-weight:800;color:var(--muted);width:16px;flex:none;font-family:var(--head)}
.savebar{position:sticky;bottom:14px;display:flex;justify-content:flex-end;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--edge);
  border-radius:18px;padding:10px 12px;margin-top:22px;box-shadow:5px 5px 0 var(--primary)}
.savebar .err{margin:0 auto 0 8px}
details.card summary{cursor:pointer;font-weight:700}
pre.ex{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 var(--mono);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1.5px dashed var(--line)}
tr:last-child td{border-bottom:0}
th{font:600 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tablewrap{overflow-x:auto}
.bar{height:12px;border-radius:99px;background:var(--red-soft);border:1.5px solid var(--edge);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px}
.sc,.tm,.timer,.scoreline .big,td,.podium small,#prog{font-variant-numeric:tabular-nums}

/* ---------- two-column pages: sticky side panel + content ---------- */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:92px;max-height:calc(100dvh - 104px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  display:flex;flex-direction:column;gap:16px;padding:2px 10px 10px 2px}
.side h1{font-size:clamp(30px,3.2vw,44px);margin:4px 0 8px}
.side .sub{font-size:15px;margin:0}
.side>.card,.side .card{margin:0;padding:18px}
.side .scoreline{margin:0}
.side .scoreline .big{font-size:76px}
.side .title-won{margin:0;align-self:flex-start}
.side .badges{margin:0}
.side .btn,.side>button{width:100%}
.side td[style*="width:140px"]{width:84px!important}
.side .pbar{display:block;height:14px;background:var(--surface-2);border:2px solid var(--edge)}
.main-col>h2.group-h:first-child{margin-top:0}
.group-h{margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.panel-label{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.solo{max-width:660px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border:2px solid var(--edge);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font:800 26px/1.1 var(--head);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--mono);color:var(--green)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft);animation:pulse 2s ease-in-out infinite}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.qnav button{min-height:42px;padding:0;border-radius:11px;font:800 14px/1 var(--head);box-shadow:2px 2px 0 var(--shadow)}
.qnav button.on{background:var(--primary);color:#fff;border-color:var(--edge)}
.qnav button.cur{outline:3px solid var(--sky);outline-offset:2px}
.toc{display:flex;flex-direction:column;gap:8px}
.toc button{justify-content:space-between;width:100%;min-height:42px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
.big-timer{display:block;text-align:center;font:800 34px/1 var(--head);padding:14px;margin:0 0 16px;border:2px solid var(--edge);border-radius:14px;background:var(--surface-2)}
.big-timer.low{background:var(--red);color:#fff}
section[id^="qc"],div[id^="qf"],h2[id^="tg-"]{scroll-margin-top:100px}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .chip{width:100%;justify-content:flex-start}
.player{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:4px;border:2px dashed var(--edge);border-radius:16px;background:var(--surface-2)}
.player .pav{display:grid;place-items:center;width:64px;height:64px;flex:none;font-size:38px;border:2px solid var(--edge);border-radius:18px;background:var(--primary-soft);box-shadow:3px 3px 0 var(--shadow)}
.player .pav.bump{animation:pop .4s var(--spring)}
.player b{display:block;font:800 24px/1.15 var(--head);letter-spacing:-.02em;overflow-wrap:anywhere}
.player span:not(.pav){font-size:13px;color:var(--muted);font-weight:600}
.side>.linkbtn{width:auto}
.enter .side>*,.enter .main-col>*{animation:rise .5s var(--out) both}
.enter .side>*:nth-child(2),.enter .main-col>*:nth-child(2){animation-delay:.06s}.enter .side>*:nth-child(3),.enter .main-col>*:nth-child(3){animation-delay:.12s}
.enter .side>*:nth-child(4),.enter .main-col>*:nth-child(4){animation-delay:.18s}.enter .side>*:nth-child(n+5),.enter .main-col>*:nth-child(n+5){animation-delay:.24s}
@media (max-width:980px){
  .split{grid-template-columns:minmax(0,1fr);gap:10px} /* minmax(0,…): long code lines scroll inside their box instead of widening the page */
  .side{position:static;max-height:none;overflow:visible;padding:0}
  .desk{display:none!important}
}
@media (min-width:981px){.mob{display:none!important}}

/* ---------- toast, skeleton ---------- */
#toast{position:fixed;left:50%;bottom:26px;z-index:50;transform:translate(-50%,30px) scale(.9);background:var(--ink);color:var(--bg);padding:12px 20px;
  border:2px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--primary);opacity:0;pointer-events:none;font-weight:700;
  transition:transform .35s var(--spring),opacity .2s}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.sk{border-radius:12px;height:16px;margin-bottom:14px;max-width:60%;background:linear-gradient(90deg,var(--line) 0,var(--surface-2) 50%,var(--line) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sk.h{height:52px;max-width:55%}
.sk.c{height:130px;max-width:none;border-radius:var(--r)}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- page entrance: content cascades in, podium grows ---------- */
.enter>*{animation:rise .5s var(--out) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
.enter .qgrid>*,.enter .lb>li{animation:rise .5s var(--out) both}
.enter .qgrid>*:nth-child(2),.enter .lb>li:nth-child(2){animation-delay:.12s}.enter .qgrid>*:nth-child(3),.enter .lb>li:nth-child(3){animation-delay:.19s}
.enter .qgrid>*:nth-child(4),.enter .lb>li:nth-child(4){animation-delay:.26s}.enter .qgrid>*:nth-child(5),.enter .lb>li:nth-child(5){animation-delay:.33s}
.enter .qgrid>*:nth-child(n+6),.enter .lb>li:nth-child(n+6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.enter .podium .blk{animation:grow .7s var(--spring) both}
.enter .podium .p2 .blk{animation-delay:.15s}.enter .podium .p1 .blk{animation-delay:.35s}.enter .podium .p3 .blk{animation-delay:.5s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hl::after{transform:skew(-8deg)}
  html{scroll-behavior:auto}
}

<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<a class="skip" href="#/" onclick="event.preventDefault();document.getElementById('app').focus()">Skip to content</a>
<header class="top"><a href="#/" class="brand"><span class="logo" aria-hidden="true">Q</span>Quiz Room</a><nav aria-label="Main">
  <a href="#/mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Mistakes</a><a href="#/top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Overall</a><a href="#/admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Create</a></nav></header>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $app = document.getElementById('app');
const L = 'ABCDEFGH';
const AVATARS = ['🦊', '🐼', '🤖', '👾', '🐱', '🦄', '🐸', '🐧', '🦁', '🐙', '🚀', '🧙']; // keep in sync with server.js
const LANGS = ['javascript','typescript','python','java','c','cpp','csharp','sql','bash','html','css','json','plaintext'];
let pollId = null, timerId = null, T = null, draft = null, baseUrl = location.origin;
let pendingDraft = null; // questions handed to the next "New quiz" (Duplicate, revision quiz)

// ---------- utils ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pin = () => { try { return localStorage.getItem('adminPin') || ''; } catch { return ''; } };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const fmtTime = (s) => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60); return m ? `${m}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`; };
const fmtDate = (t) => new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
// random per-browser id so each device can react once per emoji (getRandomValues works on plain http, randomUUID doesn't)
const devId = () => store.get('dev', null) || (store.set('dev', [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, '0')).join('')), store.get('dev', 'none'));
// titles like "closures,scope,callbacks" have no spaces: allow line breaks after , / . _ -
const brk = (t) => esc(t).replace(/([,/._-])(?=\S)/g, '$1<wbr>');
const motion = () => (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth');
const jumpTo = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: motion(), block: 'start' }); };
const loading = '<div aria-busy="true" aria-label="Loading"><div class="sk h"></div><div class="sk"></div><div class="sk c"></div><div class="sk c"></div></div>';
const quizLink = (id) => `${baseUrl}/#/q/${id}`;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(method, url, body, asAdmin) {
  const headers = { 'Content-Type': 'application/json' };
  if (asAdmin) headers['x-admin-pin'] = pin();
  const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Something went wrong. Check that the quiz server is still running.'); e.status = res.status; throw e; }
  return data;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { // clipboard API needs https; fall back for plain http on office Wi-Fi
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  toast('Link copied');
}

function codeBlock(code, lang) {
  const src = String(code || '').replace(/^\n+|\s+$/g, '');
  if (!src) return '';
  let html;
  try { html = window.hljs && hljs.getLanguage(lang) ? hljs.highlight(src, { language: lang }).value : esc(src); }
  catch { html = esc(src); }
  const n = src.split('\n').length;
  return `<div class="codebox"><div class="codebar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span style="margin-left:8px">${esc(lang)}</span></div>
  <div class="codebody"><div class="gutter">${Array.from({ length: n }, (_, i) => i + 1).join('<br>')}</div><pre><code class="hljs">${html}</code></pre></div></div>`;
}

function showError(msg) {
  $app.innerHTML = `<div class="card"><h2>Can't open this page</h2><p class="muted">${esc(msg)}</p><a class="btn" href="#/">Go to home</a></div>`;
}

// ---------- router ----------

// After a page renders: name the tab after it, move focus to its heading (screen readers hear the new page), fade it in.
let fresh = false;
new MutationObserver(() => {
  const h = fresh && $app.querySelector('h1'); if (!h) return;
  fresh = false; document.title = `${h.textContent.trim()} · Quiz Room`;
  if (!$app.contains(document.activeElement)) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  $app.classList.add('enter'); setTimeout(() => $app.classList.remove('enter'), 1400); // not on the 15s leaderboard refresh
}).observe($app, { childList: true });

function route() {
  clearInterval(pollId); clearInterval(timerId);
  fresh = true;
  document.querySelectorAll('.top nav a').forEach((a) => {
    const on = (location.hash || '#/').startsWith(a.getAttribute('href'));
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  $app.onclick = $app.oninput = $app.onchange = $app.onkeydown = $app.onsubmit = null;
  window.scrollTo(0, 0);
  const p = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (p[0] === 'q') return takeQuiz(p[1]);
  if (p[0] === 'r') return showSheet(p[1]);
  if (p[0] === 'lb') return showLeaderboard(p[1]);
  if (p[0] === 'top') return showOverall();
  if (p[0] === 'mistakes') return showMistakes();
  if (p[0] === 'admin') {
    if (!pin()) return adminLogin();
    if (p[1] === 'new') return builder();
    if (p[1] === 'edit') return builder(p[2]);
    if (p[1] === 'results') return adminResults(p[2]);
    if (p[1] === 'insights') return adminInsights();
    return adminHome();
  }
  return home();
}

// ---------- home ----------
async function home() {
  $app.innerHTML = loading;
  let list = [];
  try { list = await api('GET', '/api/quizzes'); } catch (e) { return showError(e.message); }
  const tag = (t) => `<span>${t}</span>`;
  $app.innerHTML = `<section class="hero"><p class="eyebrow">${list.length} quiz${list.length === 1 ? '' : 'zes'} open · no sign-up</p>
    <h1>Pick a quiz.<br><span class="hl">Beat your team.</span></h1>
    <p class="sub">Type your name, answer, and land on the leaderboard the moment you submit.</p>
    <div class="leaders" id="leaders"></div></section>
  ${list.length ? `<div class="qgrid">${list.map((q) => `<article class="card qcard">
    <div class="band"><div class="num">${q.count}<small>question${q.count === 1 ? '' : 's'}</small></div>
      <div class="tags">${q.timeLimit ? tag(`${q.timeLimit} min`) : tag('No time limit')}${q.practice ? tag('Practice') : ''}${q.locked ? tag('Access code') : ''}
        ${q.practice ? '' : store.get('done:' + q.id, null) ? tag('Done ✓') : tag('New for you')}</div></div>
    <div class="body"><h2>${brk(q.title)}</h2>${q.topic ? `<p class="meta" style="margin:0">${esc(q.topic)}</p>` : ''}</div>
    <div class="acts"><a class="btn" href="#/lb/${q.id}">Leaderboard</a><a class="btn btn-primary" href="#/q/${q.id}">Start →</a></div>
  </article>`).join('')}</div>`
  : `<div class="card"><p class="muted" style="margin:0">No quizzes are open right now. If you got a link on WhatsApp, open that link directly.</p></div>`}`;
  api('GET', '/api/leaderboard').then((d) => { // office top 3, filled in after the page shows
    const el = document.getElementById('leaders');
    if (el && d.entries.length) el.innerHTML = `<span class="muted" style="font-weight:600;font-size:14px">Top of the office</span>
      ${d.entries.slice(0, 3).map((e, i) => `<a class="chip" href="#/top"><b>${i + 1}</b>${e.avatar ? e.avatar + ' ' : ''}${esc(e.name)} · ${e.score} pt${e.score === 1 ? '' : 's'}</a>`).join('')}`;
  }).catch(() => {});
}

// ---------- taking a quiz ----------
async function takeQuiz(id) {
  $app.innerHTML = loading;
  let quiz;
  try { quiz = await api('GET', `/api/quizzes/${id}`); } catch (e) { return showError(e.message); }
  const done = store.get('done:' + id, null);
  if (quiz.closed) {
    $app.innerHTML = `<div class="card"><h2>${esc(quiz.title)} is closed</h2><p class="muted">The quiz creator has stopped accepting answers.</p>
    <div class="row">${done ? `<a class="btn" href="#/r/${done}">See your answer sheet</a>` : ''}<a class="btn btn-primary" href="#/lb/${id}">See leaderboard</a></div></div>`;
    return;
  }
  const saved = store.get('draft:' + id, null);
  if (saved && saved.sid) return loadSession(id, saved);
  store.del('draft:' + id); // drafts from the old version have no server session

  const lb = await api('GET', `/api/quizzes/${id}/leaderboard`).catch(() => null); // for the "who to beat" panel
  const top = lb ? lb.entries.filter((e) => !e.late).slice(0, 3) : [];
  const me = store.get('quizName', ''), myAv = store.get('avatar', '') || AVATARS[0];
  $app.innerHTML = `<div class="split"><aside class="side">
    <div><p class="eyebrow">${quiz.practice ? 'Practice round' : 'Ranked quiz'}</p><h1>${brk(quiz.title)}</h1>
      ${quiz.topic ? `<p class="sub">${esc(quiz.topic)}</p>` : ''}</div>
    <div class="stats"><div class="stat"><b>${quiz.count}</b><span>questions</span></div><div class="stat"><b>${quiz.timeLimit ? quiz.timeLimit + 'm' : '∞'}</b><span>time limit</span></div>
      ${lb ? `<div class="stat"><b>${lb.entries.length}</b><span>played so far</span></div><div class="stat"><b>${top[0] ? `${top[0].score}/${top[0].total}` : '–'}</b><span>score to beat</span></div>` : ''}</div>
    ${top.length ? `<div class="card"><p class="panel-label">Who to beat</p><div class="stack">${top.map((e, i) => `<a class="chip" href="#/lb/${id}"><b>${i + 1}</b>${e.avatar ? e.avatar + ' ' : ''}${esc(e.name)} · ${e.score}/${e.total}</a>`).join('')}</div>
      <a class="btn" href="#/lb/${id}" style="margin-top:14px">Full leaderboard</a></div>`
      : !quiz.practice ? '<div class="card"><p style="margin:0">Nobody has played yet. <b>Be the first on the board.</b></p></div>' : ''}
  </aside><div class="main-col">
  ${quiz.practice ? '<div class="card"><p style="margin:0"><span class="pill">Practice</span> Retake as often as you like. Practice scores are not ranked.</p></div>'
    : done ? `<div class="card"><p style="margin:0">You already took this quiz on this device. <a href="#/r/${done}">See your answer sheet</a></p></div>` : ''}
  <form class="card" id="nameForm" novalidate>
    <p class="panel-label">Your player card</p>
    <div class="player" aria-hidden="true"><span class="pav" id="pAv">${myAv}</span><div><b id="pName">${esc(me) || 'Your name'}</b><span>${quiz.practice ? 'Practice mode' : 'Ready for the leaderboard'}</span></div></div>
    <label class="f" for="nm">Your name</label>
    <input id="nm" maxlength="40" autocomplete="name" placeholder="e.g. Sahil" value="${esc(me)}">
    <fieldset class="avatars"><legend class="f">Pick your avatar</legend>
      ${AVATARS.map((av, i) => `<label><input type="radio" name="av" value="${av}" ${av === myAv ? 'checked' : ''}><span aria-label="Avatar ${i + 1}">${av}</span></label>`).join('')}
    </fieldset>
    ${quiz.locked ? '<label class="f" for="cd">Access code</label><input id="cd" maxlength="40" autocomplete="off" autocapitalize="off">' : ''}
    <p class="err" id="nmErr"></p>
    <button class="btn-primary" type="submit" style="width:100%;min-height:54px;font-size:17px">Start quiz →</button>
    <p class="hint">${quiz.practice ? '' : 'Your name appears on the leaderboard.'}${quiz.timeLimit ? ' The timer starts when you press Start.' : ''}</p>
  </form></div></div>`;
  $app.oninput = $app.onchange = (e) => { // live player card
    if (e.target.id === 'nm') document.getElementById('pName').textContent = e.target.value.trim() || 'Your name';
    if (e.target.name === 'av') { const a = document.getElementById('pAv'); a.textContent = e.target.value; a.classList.remove('bump'); void a.offsetWidth; a.classList.add('bump'); }
  };
  document.getElementById('nm').focus();
  $app.onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button'); const err = document.getElementById('nmErr');
    btn.disabled = true; err.textContent = '';
    const cd = document.getElementById('cd');
    try {
      const name = document.getElementById('nm').value;
      const avatar = (document.querySelector('input[name=av]:checked') || {}).value || '';
      const r = await api('POST', `/api/quizzes/${id}/start`, { name, avatar, code: cd ? cd.value : '' });
      store.set('quizName', name.trim()); store.set('avatar', avatar);
      loadSession(id, { sid: r.sid });
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  };
}

const shuffled = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function loadSession(id, saved) {
  $app.innerHTML = loading;
  let s;
  try { s = await api('GET', `/api/sessions/${saved.sid}`); }
  catch (e) { store.del('draft:' + id); return showError(e.message); }
  const { quiz } = s, qs = quiz.questions;
  const keep = (n) => [...Array(n).keys()];
  // Answers are stored by original question/option index; shuffling only changes what is shown.
  T = {
    sid: s.sid, quiz, name: s.name, practice: s.practice,
    startedAt: s.startedAt + (Date.now() - s.now), // server clock, shifted to this device's clock
    answers: saved.answers || qs.map((q) => (q.type === 'mcq' ? null : '')),
    order: saved.order || (quiz.shuffle ? shuffled(qs.length) : keep(qs.length)),
    optOrder: saved.optOrder || qs.map((q) => (q.type !== 'mcq' ? null : quiz.shuffle ? shuffled(q.options.length) : keep(q.options.length))),
  };
  saveDraft(); renderTaking();
}

function saveDraft() { store.set('draft:' + T.quiz.id, { sid: T.sid, answers: T.answers, order: T.order, optOrder: T.optOrder }); }
const isAnswered = (q, a) => (q.type === 'mcq' ? a !== null && a !== undefined : !!String(a || '').trim());

function renderTaking() {
  const { quiz } = T;
  $app.innerHTML = `<div class="split"><aside class="side">
    <div><p class="panel-label">${T.practice ? 'Practice round' : 'Ranked quiz'}</p><h1>${brk(quiz.title)}</h1>
      <p class="sub">Answering as <b>${esc(T.name)}</b>${quiz.topic ? ` · ${esc(quiz.topic)}` : ''}</p></div>
    <div class="card desk">
      ${quiz.timeLimit ? '<span class="timer big-timer" data-timer></span>' : ''}
      <p class="panel-label" data-prog></p><span class="pbar" aria-hidden="true"><i data-pfill></i></span>
      <button class="btn-primary" data-submit style="width:100%;margin-top:16px">Submit answers</button>
      <p class="panel-label" style="margin:20px 0 10px">Jump to a question</p>
      <div class="qnav">${T.order.map((i, pos) => `<button type="button" data-jump="${i}" aria-label="Go to question ${pos + 1}">${pos + 1}</button>`).join('')}</div>
    </div>
  </aside><div class="main-col">
  ${T.order.map((i, pos) => { const q = quiz.questions[i]; return `<section class="card" id="qc${i}" aria-labelledby="qt${i}">
    <h2 class="q-title" id="qt${i}"><span class="qnum">${pos + 1}</span>${esc(q.text)}</h2>${codeBlock(q.code, q.language)}
    ${q.type === 'mcq'
      ? T.optOrder[i].map((j, k) => `<button type="button" class="opt ${T.answers[i] === j ? 'pick' : ''}" data-q="${i}" data-o="${j}" aria-pressed="${T.answers[i] === j}"><span class="k">${L[k]}</span><span class="t">${esc(q.options[j])}</span></button>`).join('')
      : `<label class="f" for="out${i}" style="margin-top:0">Type the exact output</label>
         <textarea class="code-in small" id="out${i}" data-q="${i}" spellcheck="false" autocapitalize="off" autocomplete="off">${esc(T.answers[i])}</textarea>
         <p class="hint">Write exactly what gets printed. Spaces and line breaks are treated the same.</p>`}
  </section>`; }).join('')}
  <div class="submitbar mob"><span data-prog></span><span class="pbar" aria-hidden="true"><i data-pfill></i></span><span class="timer" data-timer></span><button class="btn-light" data-submit>Submit answers</button></div>
  </div></div>`;

  const prog = () => {
    const n = quiz.questions.filter((q, i) => isAnswered(q, T.answers[i])).length;
    const total = quiz.questions.length;
    const cheer = n === 0 ? "Let's go 🚀" : n >= total ? 'All done, hit submit 🎉' : n === total - 1 ? 'Last one! 🏁' : n >= total / 2 ? 'Halfway there 💪' : '';
    document.querySelectorAll('[data-prog]').forEach((el) => { el.textContent = `${n} of ${total} answered${cheer ? ` · ${cheer}` : ''}`; });
    document.querySelectorAll('[data-pfill]').forEach((el) => { el.style.transform = `scaleX(${total ? n / total : 0})`; });
    document.querySelectorAll('[data-jump]').forEach((b) => b.classList.toggle('on', isAnswered(quiz.questions[+b.dataset.jump], T.answers[+b.dataset.jump])));
  };
  prog();
  // ring the navigator number of the question in view
  const io = new IntersectionObserver((es) => es.forEach((en) => {
    if (en.isIntersecting) document.querySelectorAll('[data-jump]').forEach((b) => b.classList.toggle('cur', 'qc' + b.dataset.jump === en.target.id));
  }), { rootMargin: '-35% 0px -60% 0px' });
  document.querySelectorAll('section[id^="qc"]').forEach((el) => io.observe(el));

  $app.onclick = (e) => {
    const b = e.target.closest('button.opt');
    if (b) {
      const qi = +b.dataset.q, oi = +b.dataset.o;
      T.answers[qi] = oi; saveDraft(); prog();
      b.parentElement.querySelectorAll('button.opt').forEach((x) => { const on = +x.dataset.o === oi; x.classList.toggle('pick', on); x.setAttribute('aria-pressed', on); });
    }
    const j = e.target.closest('[data-jump]'); if (j) jumpTo('qc' + j.dataset.jump);
    if (e.target.closest('[data-submit]')) submitQuiz(false);
  };
  $app.oninput = (e) => { if (e.target.matches('textarea[data-q]')) { T.answers[+e.target.dataset.q] = e.target.value; saveDraft(); prog(); } };

  if (quiz.timeLimit) {
    const tick = () => {
      const left = quiz.timeLimit * 60 - Math.floor((Date.now() - T.startedAt) / 1000);
      const els = document.querySelectorAll('[data-timer]');
      if (!els.length) return clearInterval(timerId);
      els.forEach((el) => { el.textContent = `${fmtTime(left)} left`; el.classList.toggle('low', left <= 60); el.classList.toggle('shake', left <= 30); });
      if (left <= 0) { clearInterval(timerId); toast('Time is up. Submitting your answers.'); submitQuiz(true); }
    };
    tick(); timerId = setInterval(tick, 1000);
  }
}

async function submitQuiz(auto) {
  const { quiz } = T;
  const missing = quiz.questions.filter((q, i) => !isAnswered(q, T.answers[i])).length;
  if (!auto && missing && !confirm(`${missing} question${missing === 1 ? ' is' : 's are'} not answered yet. Submit anyway?`)) return;
  const btns = document.querySelectorAll('[data-submit]'); btns.forEach((b) => { b.disabled = true; });
  try {
    const r = await api('POST', `/api/sessions/${T.sid}/submit`, { name: T.name, answers: T.answers });
    clearInterval(timerId);
    store.del('draft:' + quiz.id); if (!T.practice) store.set('done:' + quiz.id, r.id);
    store.set('mine', [...store.get('mine', []), r.id].slice(-50));
    store.set('celebrate', r.id); // confetti only right after submitting, not on every revisit
    location.hash = `#/r/${r.id}`;
  } catch (e) {
    btns.forEach((b) => { b.disabled = false; });
    if (e.status === 409) {
      const n = prompt(`${e.message}\nType a different name to submit your answers:`, T.name + ' 2');
      if (n) { T.name = n; return submitQuiz(true); }
    }
    if (e.status === 404) store.del('draft:' + quiz.id);
    toast(e.message);
  }
}

// ---------- answer sheet ----------
// rows: [{ tag, correct }] → card with a bar per tag, weakest first
function tagCard(rows, title, note) {
  const by = {};
  for (const r of rows) if (r.tag) { const t = by[r.tag] || (by[r.tag] = { ok: 0, n: 0 }); t.n++; if (r.correct) t.ok++; }
  const tags = Object.entries(by).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n);
  if (!tags.length) return '';
  return `<div class="card"><h2>${title}</h2><p class="meta">${note}</p><div class="tablewrap"><table><tbody>
    ${tags.map(([t, s]) => `<tr><td>${esc(t)}</td><td style="width:140px"><div class="bar"><span style="width:${(s.ok / s.n) * 100}%"></span></div></td><td style="width:70px">${s.ok}/${s.n}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

const isBlank = (q) => (q.type === 'mcq' ? q.given === null : !String(q.given || '').trim());
// given vs correct answer, plus the explanation
function answerBody(q) {
  const body = q.type === 'mcq'
    ? q.options.map((o, j) => {
        const isAns = j === q.answer, isPick = j === q.given;
        const note = [isPick ? 'Selected' : '', isAns ? 'Correct answer' : ''].filter(Boolean).join(', ');
        return `<div class="opt ${isAns ? 'right' : isPick ? 'wrong' : ''}"><span class="k">${L[j]}</span><span class="t">${esc(o)}</span>${note ? `<span class="note">${note}</span>` : ''}</div>`;
      }).join('')
    : `<div class="outcmp"><div><div class="lbl">Answer given</div><pre class="${q.correct ? 'okp' : 'nop'}">${esc(isBlank(q) ? '(left blank)' : q.given)}</pre></div>
       <div><div class="lbl">Expected output</div><pre class="okp">${esc(q.answer)}</pre></div></div>`;
  return body + (q.explanation ? `<div class="explain">${esc(q.explanation)}</div>` : '');
}

function sheetItems(items) {
  return items.map((q, i) => {
    const blank = isBlank(q);
    return `<section class="card"><div class="spread"><h2 class="q-title"><span class="qnum">${i + 1}</span>${esc(q.text)}${q.tag ? ` <span class="pill">${esc(q.tag)}</span>` : ''}</h2>
      <span class="badge ${q.correct ? 'ok' : 'no'}">${q.correct ? 'Correct' : blank ? 'Not answered' : 'Incorrect'}</span></div>
      ${codeBlock(q.code, q.language)}${answerBody(q)}</section>`;
  }).join('');
}

const funTitle = (pct) => pct === 100 ? 'Closure Wizard 🧙' : pct >= 80 ? 'Scope Ninja 🥷' : pct >= 60 ? 'Callback Captain 🧭'
  : pct >= 40 ? 'Hoisted, Not Initialized 😅' : pct >= 20 ? 'Stuck in the TDZ 🧊' : 'ReferenceError 💀';

function badges(a) {
  const out = [];
  if (a.total && a.score === a.total) out.push('🎯 Perfect');
  const fast = a.timeLimit ? a.timeTaken < a.timeLimit * 30 : a.timeTaken < a.total * 20; // half the limit, or 20s a question
  if (a.score && fast && !a.late) out.push('⚡ Speedrunner');
  if (a.items) {
    let run = 0, best = 0;
    for (const q of a.items) { run = q.correct ? run + 1 : 0; best = Math.max(best, run); }
    if (best >= 5 && a.score !== a.total) out.push(`🔥 Streak of ${best}`);
    const by = {};
    for (const q of a.items) if (q.tag) (by[q.tag] = by[q.tag] || []).push(q.correct);
    for (const [t, r] of Object.entries(by)) if (r.length >= 2 && r.every(Boolean)) out.push(`🧠 ${t} master`);
  }
  return out;
}

function celebrate(pct) { // not named confetti: a global function of that name would shadow the library's window.confetti
  const go = () => window.confetti({ particleCount: pct === 100 ? 220 : 110, spread: pct === 100 ? 100 : 70, origin: { y: 0.6 }, disableForReducedMotion: true });
  if (window.confetti) return go();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js';
  s.onload = go; document.head.appendChild(s); // no confetti offline, nothing else breaks
}

// score ticks up from 0 (skipped with reduced motion)
function countUp(el, to, total) {
  if (!el || !to || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now();
  const step = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = `${Math.round(to * (1 - (1 - k) ** 3))}/${total}`; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

async function showSheet(aid) {
  $app.innerHTML = loading;
  let a;
  try { a = await api('GET', `/api/attempts/${aid}`, null, !!pin()); } catch (e) { return showError(e.message); }
  const pct = a.total ? Math.round((a.score / a.total) * 1000) / 10 : 0;
  $app.innerHTML = `<div class="split"><aside class="side">
    <div><p class="panel-label">${brk(a.quizTitle)}</p><h1>${a.avatar ? a.avatar + ' ' : ''}${esc(a.name)}'s answer sheet</h1></div>
    <div class="scoreline"><span class="big">${a.score}/${a.total}</span></div>
    <p class="sub">${pct}% correct in ${fmtTime(a.timeTaken)}<br><span style="font-size:13px">Submitted ${fmtDate(a.submittedAt)}</span></p>
    ${a.practice ? '<span class="pill" style="align-self:flex-start">Practice, not ranked</span>' : ''}${a.late ? '<span class="badge no" style="align-self:flex-start">Submitted after the time limit</span>' : ''}
    <p class="title-won">${funTitle(pct)}</p>
    ${(() => { const b = badges(a); return b.length ? `<div class="badges">${b.map((x) => `<span class="bdg">${esc(x)}</span>`).join('')}</div>` : ''; })()}
    <div class="stack">${a.practice ? `<a class="btn btn-primary" href="#/q/${a.quizId}">Practice again</a>` : `<a class="btn btn-primary" href="#/lb/${a.quizId}">See leaderboard</a>`}${a.items && a.score < a.total ? '<a class="btn" href="#/mistakes">📝 Review your mistakes</a>' : ''}</div>
    ${a.items ? tagCard(a.items, 'Your topics', 'Weakest first. Revise these next.') : ''}
  </aside><div class="main-col">
  ${a.items ? sheetItems(a.items) : '<div class="card"><p class="muted" style="margin:0">Correct answers are hidden for this quiz. Your score is saved and shows on the leaderboard.</p></div>'}
  </div></div>`;
  countUp($app.querySelector('.scoreline .big'), a.score, a.total);
  if (store.get('celebrate', null) === aid) { store.del('celebrate'); if (pct >= 80) celebrate(pct); }
}

// ---------- my mistakes ----------
// Built from the answer sheets this device submitted ('mine'); no account, so other devices have their own list.
const norm = (s) => String(s ?? '').trim().split(/\s+/).filter(Boolean).join(' '); // same check as server.js
async function showMistakes() {
  $app.innerHTML = loading;
  const who = store.get('quizName', '');
  const [own, byName] = await Promise.all([
    Promise.all(store.get('mine', []).map((id) => api('GET', `/api/attempts/${id}`).catch(() => null))),
    who ? api('GET', `/api/mistakes?name=${encodeURIComponent(who)}`).catch(() => []) : [],
  ]);
  const seen = new Set(); // the same sheet can come from both lists
  const sheets = [...own, ...byName].filter((a) => a && a.items && !seen.has(a.quizId + '|' + a.submittedAt) && seen.add(a.quizId + '|' + a.submittedAt))
    .sort((a, b) => a.submittedAt - b.submittedAt);
  const wrong = new Map(); // one entry per question; a later correct answer clears it
  for (const a of sheets) for (const q of a.items) {
    const k = `${a.quizId}|${q.text}|${q.code}`;
    if (q.correct) wrong.delete(k); else wrong.set(k, { ...q, k, quizTitle: a.quizTitle });
  }
  const all = [...wrong.values()];
  let showHidden = false;
  let quiz = null; // "Quiz me" round: { order, pos, score, seen }; seen = this question was already answered or its answer shown
  const card = (i, got) => { const q = all[i]; return `<section class="card" data-card="${i}">
    <p class="meta" style="margin-bottom:6px">${esc(q.quizTitle)}${q.tag ? ` · ${esc(q.tag)}` : ''}</p><h2 class="q-title">${esc(q.text)}</h2>${codeBlock(q.code, q.language)}
    ${q.type === 'mcq'
      ? q.options.map((o, j) => `<button type="button" class="opt" data-pick="${j}"><span class="k">${L[j]}</span><span class="t">${esc(o)}</span>${j === q.given ? '<span class="note" hidden>Your answer before</span>' : ''}</button>`).join('')
      : `<label class="f" for="re${i}" style="margin-top:0">Type the output again</label><textarea class="code-in small" id="re${i}" spellcheck="false" autocapitalize="off"></textarea>
         <button type="button" class="btn-sm" data-check="1" style="margin-top:8px">Check</button>`}
    <p class="err" data-res aria-live="polite" style="min-height:0"></p>
    <div class="row"><button type="button" class="btn-sm" data-show="1">Show answer</button>
      <button type="button" class="btn-sm" data-got="1">${got.has(q.k) ? 'Not yet' : 'Got it ✓'}</button></div>
    <div data-ans hidden style="margin-top:14px">${q.type === 'mcq'
      ? (q.explanation ? `<div class="explain">${esc(q.explanation)}</div>` : '')
      : `<p class="muted" style="font-size:14px;font-weight:600;margin:0 0 6px">Your answer before vs the expected output</p>${answerBody(q)}`}</div>
  </section>`; };
  const render = () => {
    const got = new Set(store.get('gotit', []));
    if (quiz) {
      const n = quiz.order.length;
      $app.innerHTML = quiz.pos >= n
        ? `<div class="solo"><p class="eyebrow">Mistakes quiz</p><h1>Round done</h1><div class="scoreline"><span class="big">${quiz.score}/${n}</span><span>right this time</span></div>
           <p class="sub">${quiz.score === n ? 'All fixed 🎉 Mark them as understood on your mistakes list.' : 'Go through the ones you missed once more, then try again.'}</p>
           <div class="row"><button class="btn-primary" id="quizStart">Quiz me again</button><button id="quizExit">Back to my mistakes</button></div></div>`
        : `<div class="split"><aside class="side">
             <div><p class="panel-label">Mistakes quiz</p><h1>Question ${quiz.pos + 1} of ${n}</h1></div>
             <div class="card"><div class="stats"><div class="stat"><b>${quiz.score}</b><span>right so far</span></div><div class="stat"><b>${n - quiz.pos - 1}</b><span>left after this</span></div></div>
               <span class="pbar" style="margin-top:14px" aria-hidden="true"><i style="transform:scaleX(${quiz.pos / n})"></i></span></div>
             <p class="hint" style="margin:0">Only your first try counts. Showing the answer counts as a miss.</p>
             <button id="quizExit">Stop the round</button>
           </aside><div class="main-col">${card(quiz.order[quiz.pos], got)}
             <div class="row"><button class="btn-primary" id="quizNext">${quiz.pos + 1 < n ? 'Next question →' : 'See my score'}</button></div></div></div>`;
      return;
    }
    const groups = {};
    all.forEach((q, i) => { if (showHidden || !got.has(q.k)) (groups[q.tag || 'Other'] ||= []).push(i); });
    const open = all.filter((q) => !got.has(q.k)).length, shown = Object.values(groups).flat().length, hiddenN = all.length - open;
    const sorted = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
    $app.innerHTML = `<div class="split"><aside class="side">
      <div><h1>My mistakes</h1><p class="sub">Try each one again, check the answer, and mark it once it clicks. Tries here never change your score.</p></div>
      <div class="stats"><div class="stat"><b>${open}</b><span>to review</span></div><div class="stat"><b>${hiddenN}</b><span>understood</span></div></div>
      ${open ? `<button class="btn-primary" id="quizStart">🎯 Quiz me on ${open} mistake${open === 1 ? '' : 's'}</button>` : ''}
      ${sorted.length > 1 ? `<div class="card"><p class="panel-label">Jump to a topic</p><div class="toc">${sorted.map(([tag, ids], gi) => `<button type="button" data-toc="${gi}"><span>${esc(tag)}</span><span class="pill">${ids.length}</span></button>`).join('')}</div></div>` : ''}
      <form class="card" id="whoForm" novalidate><label class="f" for="who" style="margin-top:0">Your name</label>
        <div class="row" style="flex-wrap:nowrap"><input id="who" maxlength="40" autocomplete="name" value="${esc(who)}" placeholder="The name you play with"><button type="submit">Show</button></div>
        <p class="hint">This device's quizzes, plus closed quizzes played under this name anywhere.</p></form>
      ${hiddenN ? `<button class="linkbtn" id="toggleHidden" style="align-self:flex-start">${showHidden ? 'Hide' : 'Show'} the ${hiddenN} marked as understood</button>` : ''}
    </aside><div class="main-col">
    ${!all.length ? '<div class="card"><p class="muted" style="margin:0">Nothing to review. Either you got everything right, or you have not submitted a quiz on this device yet.</p></div>'
      : !shown ? '<div class="card"><p style="margin:0">All caught up 🎉 Every mistake is marked as understood.</p></div>' : ''}
    ${sorted.map(([tag, ids], gi) => `<h2 class="group-h" id="tg-${gi}">${esc(tag)} <span class="pill">${ids.length}</span></h2>
      ${ids.map((i) => card(i, got)).join('')}`).join('')}
    </div></div>`;
  };
  $app.onclick = (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'toggleHidden') { showHidden = !showHidden; return render(); }
    if (t.dataset.toc) return jumpTo('tg-' + t.dataset.toc);
    if (t.id === 'quizStart') {
      const got = new Set(store.get('gotit', []));
      quiz = { order: shuffled(all.length).filter((i) => !got.has(all[i].k)), pos: 0, score: 0, seen: false };
      window.scrollTo(0, 0); return render();
    }
    if (t.id === 'quizNext') { quiz.pos++; quiz.seen = false; window.scrollTo(0, 0); return render(); }
    if (t.id === 'quizExit') { quiz = null; return render(); }
    const card = t.closest('[data-card]'); if (!card) return;
    const i = +card.dataset.card, q = all[i];
    const reveal = () => { // mark the right option in the same list, label the earlier pick, show the why
      card.querySelector('[data-ans]').hidden = false;
      card.querySelectorAll('[data-pick]').forEach((b) => { if (+b.dataset.pick === q.answer) b.classList.add('right'); });
      card.querySelectorAll('.note[hidden]').forEach((n) => { n.hidden = false; });
    };
    const result = (ok) => {
      if (quiz && !quiz.seen && ok) quiz.score++; // only the first try counts
      if (quiz) quiz.seen = true;
      const r = card.querySelector('[data-res]');
      r.textContent = ok ? 'Correct! 🎉' : q.type === 'mcq' ? 'Not quite. The green one is right.' : 'Not quite. Check the answer below.';
      r.style.color = ok ? 'var(--green)' : 'var(--red)';
      reveal();
    };
    if (t.dataset.pick) {
      const j = +t.dataset.pick;
      card.querySelectorAll('[data-pick]').forEach((b) => { const n = +b.dataset.pick; b.classList.toggle('right', n === q.answer); b.classList.toggle('wrong', n === j && j !== q.answer); });
      return result(j === q.answer);
    }
    if (t.dataset.check) { const v = document.getElementById(`re${i}`).value; return result(!!norm(v) && norm(v) === norm(q.answer)); }
    if (t.dataset.show) { if (quiz) quiz.seen = true; return reveal(); }
    if (t.dataset.got) {
      const got = store.get('gotit', []);
      store.set('gotit', got.includes(q.k) ? got.filter((x) => x !== q.k) : [...got, q.k].slice(-500));
      render();
    }
  };
  $app.onsubmit = (e) => { e.preventDefault(); store.set('quizName', document.getElementById('who').value.trim()); showMistakes(); };
  render();
}

// top 3 on a podium, shown 2-1-3; line(e) is the small text under the medal
function podium(top, line) {
  if (top.length < 2) return '';
  const medal = ['🥇', '🥈', '🥉'];
  return `<div class="podium" aria-hidden="true">${[1, 0, 2].map((r) => { const e = top[r]; return e ? `<div class="p p${r + 1}">
    ${r === 0 ? '<div class="crown">👑</div>' : ''}${e.avatar ? `<div class="av">${e.avatar}</div>` : ''}<div class="who">${esc(e.name)}</div>
    <div class="blk">${medal[r]}<small>${line(e)}</small></div></div>` : '<div></div>'; }).join('')}</div>`;
}

// % correct per quiz, oldest to newest; hover a dot for the quiz (the history list below is the table view)
function spark(hist) {
  if (hist.length < 2) return '';
  const W = 240, H = 56, P = 8;
  const pts = [...hist].reverse().map((h, i, a) => ({ ...h, x: P + (i * (W - 2 * P)) / (a.length - 1), y: H - P - (h.total ? h.score / h.total : 0) * (H - 2 * P) }));
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Percent correct per quiz, oldest to newest" style="display:block;max-width:100%;margin:8px 0 2px">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)"/>
    <polyline points="${pts.map((p) => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p) => `<g><title>${esc(p.title)}: ${p.score}/${p.total} (${p.total ? Math.round((p.score / p.total) * 100) : 0}%)</title>
      <circle cx="${p.x}" cy="${p.y}" r="12" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/></g>`).join('')}
  </svg><span class="muted" style="font-size:12px">% correct, oldest → newest</span>`;
}

const allTimeBadges = (e) => [
  e.wins ? `🏆 ${e.wins} win${e.wins === 1 ? '' : 's'}` : '',
  e.perfect ? `🎯 ${e.perfect} perfect` : '',

].filter(Boolean);

function adminLogin(msg) {
  $app.innerHTML = `<h1>Create and manage quizzes</h1><p class="sub">Only the person running the quiz needs this PIN. People taking quizzes never see it.</p>
  <form class="card" id="pinForm" novalidate><label class="f" for="pinIn" style="margin-top:0">Admin PIN</label>
  <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password">
  <p class="err" id="pinErr">${esc(msg || '')}</p><button class="btn-primary" type="submit">Open dashboard</button>
  <p class="hint">The PIN is shown in the terminal where the server was started.</p></form>`;
  document.getElementById('pinIn').focus();
  $app.onsubmit = async (e) => {
    e.preventDefault();
    try { localStorage.setItem('adminPin', document.getElementById('pinIn').value); } catch {}
    try { await api('POST', '/api/admin/check', null, true); route(); }
    catch (ex) { store.del('adminPin'); document.getElementById('pinErr').textContent = ex.message; }
  };
}

async function adminCall(fn) {
  try { return await fn(); }
  catch (e) { if (e.status === 401) { store.del('adminPin'); adminLogin('That PIN is wrong.'); } else toast(e.message); throw e; }
}
